
# 数据库配置
spring:
  datasource:
    #url: jdbc:mysql://121.43.102.188:3306/th4-dr?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&autoReconnect=true&serverTimezone=GMT%2B8
    url: jdbc:mysql://127.0.0.1:3306/decoboon-test?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&autoReconnect=true&serverTimezone=GMT%2B8
    username: root

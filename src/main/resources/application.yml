# 环境配置

# 数据库参数配置
spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  profiles:
    active: dev
# 数据库连接池配置
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: MyHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jpa:
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  data:
    # redis配置
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT_MS:1000}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 服务器配置
server:
  address: 0.0.0.0
  port: 8090

# 日志配置
logging:
  file:
    path: logs/
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: INFO

# th4 框架配置 默认配置
th4:
  edge:
    framework:
      upload-dir: ${TH4_FILE_UPLOAD_DIR:./data/upload/}
      public-dir: ${TH4_FILE_PUBLIC_DIR:./data/public/}
      file-signature-secret: ${TH4_FILE_SIGNATURE_SECRET:}
      file-signature-ttl-seconds: ${TH4_FILE_SIGNATURE_TTL_SECONDS:300}
      security:
        sso: true
        password:
          bootstrap-token: ${TH4_PASSWORD_BOOTSTRAP_TOKEN:}
          max-failed-attempts: ${TH4_PASSWORD_MAX_FAILED_ATTEMPTS:5}
          lock-minutes: ${TH4_PASSWORD_LOCK_MINUTES:15}
    components:
      storage:
        # local 仅用于开发/测试；生产必须使用 oss 并通过环境变量注入密钥
        provider: ${TH4_STORAGE_PROVIDER:local}
        endpoint: ${ALIYUN_OSS_ENDPOINT:}
        bucket: ${ALIYUN_OSS_BUCKET:decoboon}
        access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
        access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
        presign-ttl-seconds: ${ALIYUN_OSS_PRESIGN_TTL_SECONDS:300}
        max-file-size-bytes: ${ALIYUN_OSS_MAX_FILE_SIZE_BYTES:524288000}
        key-prefix: ${ALIYUN_OSS_KEY_PREFIX:}
      wechat:
        mini-program:
          enabled: ${WECHAT_MINI_ENABLED:true}
          app-id: ${WECHAT_MINI_APP_ID:wxe5cc5fec9e50a9a9}
          app-secret: ${WECHAT_MINI_APP_SECRET:}
          connect-timeout-ms: 3000
          read-timeout-ms: 5000
        pay:
          # 微信支付 API v3；商户私钥、API v3 密钥和回调地址只允许通过环境变量注入
          enabled: ${WECHAT_PAY_ENABLED:false}
          app-id: ${WECHAT_PAY_APP_ID:${WECHAT_MINI_APP_ID:}}
          mch-id: ${WECHAT_PAY_MCH_ID:}
          mch-serial-no: ${WECHAT_PAY_MCH_SERIAL_NO:}
          private-key: ${WECHAT_PAY_PRIVATE_KEY:}
          private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
          api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
          notify-url: ${WECHAT_PAY_NOTIFY_URL:}
          platform-public-key-id: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_ID:}
          platform-public-key: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:}
          platform-public-key-path: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:}
          connect-timeout-ms: ${WECHAT_PAY_CONNECT_TIMEOUT_MS:3000}
          read-timeout-ms: ${WECHAT_PAY_READ_TIMEOUT_MS:8000}

# 平台运营管理端首次初始化；默认关闭，创建完成后应移除或关闭环境变量。
decoboon:
  platform:
    bootstrap:
      enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
      org-code: ${PLATFORM_BOOTSTRAP_ORG_CODE:DECOBOON}
      org-name: ${PLATFORM_BOOTSTRAP_ORG_NAME:装得清平台运营中心}
      department-code: ${PLATFORM_BOOTSTRAP_DEPARTMENT_CODE:PLATFORM}
      department-name: ${PLATFORM_BOOTSTRAP_DEPARTMENT_NAME:平台运营中心}
      phone: ${PLATFORM_BOOTSTRAP_PHONE:}
      username: ${PLATFORM_BOOTSTRAP_USERNAME:平台超级管理员}
      password: ${PLATFORM_BOOTSTRAP_PASSWORD:}
